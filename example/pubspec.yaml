name: tizen_interop_example
description: Demonstrates how to use the tizen_interop plugin.
publish_to: 'none'

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  ffi: ^2.0.1
  flutter:
    sdk: flutter
  tizen_interop:
    path: ../
  tizen_interop_callbacks:
    path: ../packages/tizen_interop_callbacks

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  integration_test_tizen: ^2.0.3

flutter:
  uses-material-design: true
